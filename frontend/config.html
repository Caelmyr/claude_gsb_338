<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>场景配置 · 复杂系统模拟仿真平台</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="topnav" id="topnav"></nav>
  <main class="container">
    <h1 class="page-title">场景配置</h1>
    <p class="page-sub">配置仿真场景：选择领域与模型、设置地图与参数、安排定时干预措施。</p>

    <div class="grid" style="grid-template-columns:340px 1fr; gap:18px">
      <div>
        <div class="card">
          <div class="row between" style="margin-bottom:10px">
            <h3 style="margin:0">已保存场景</h3>
            <button class="btn small primary" id="newScene">+ 新建</button>
          </div>
          <div id="sceneList"></div>
        </div>
      </div>

      <div class="card">
        <h2 id="formTitle">新建场景</h2>
        <div class="field"><label>名称</label><input id="fName" placeholder="例如：交通 · 拥堵对比"></div>
        <div class="grid grid-2">
          <div class="field"><label>领域</label><select id="fDomain"></select></div>
          <div class="field"><label>模型</label><select id="fModel"></select></div>
        </div>
        <div class="field"><label>描述</label><textarea id="fDesc" rows="2"></textarea></div>

        <h3>参数</h3>
        <div id="fParams" class="grid grid-2"></div>

        <h3>初始态导入（可选）</h3>
        <p class="muted small">从 JSON / CSV 导入个体的初始位置、状态与类型，作为场景的确定初始态；导入后将完全替代按密度 / 数量的随机初始化。校验通过后可预览，预览即为正式运行第 0 步的真实布局。</p>
        <div class="row" style="margin-bottom:8px">
          <select id="isFormat" style="max-width:130px">
            <option value="auto">自动识别格式</option>
            <option value="json">JSON</option>
            <option value="csv">CSV</option>
          </select>
          <input type="file" id="isFile" accept=".json,.csv,.txt" style="max-width:260px">
          <button class="btn small" id="isTemplate">下载模板</button>
          <button class="btn small" id="isFields">字段说明</button>
        </div>
        <textarea id="isText" rows="6" placeholder='粘贴 JSON（[{"x":1,"y":0,"state":"infected"}, …]）或 CSV（首行为表头）'></textarea>
        <div class="row" style="margin-top:8px">
          <button class="btn primary small" id="isValidate">校验并预览</button>
          <button class="btn danger small" id="isClear">清除导入</button>
          <span class="muted small" id="isHint"></span>
        </div>
        <div id="isFieldsBox" style="display:none; margin-top:10px"></div>
        <div id="isErrors" style="margin-top:10px"></div>
        <div id="isPreviewBox" style="display:none; margin-top:12px">
          <div class="canvas-wrap"><canvas id="isPreview"></canvas></div>
          <div class="legend" id="isLegend"></div>
          <p class="muted small" id="isSummary"></p>
        </div>

        <h3>定时干预措施</h3>
        <p class="muted small">干预将在运行到达「触发步」时自动施加。</p>
        <div id="fInterventions"></div>
        <button class="btn small" id="addItv">+ 添加干预</button>

        <div class="row" style="margin-top:18px">
          <button class="btn primary" id="saveScene">保存场景</button>
          <button class="btn" id="runScene">保存并创建运行</button>
          <span class="muted small" id="formStatus"></span>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/render.js"></script>
  <script src="/js/config.js"></script>
</body>
</html>
